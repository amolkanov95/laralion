# ============================================
# Decap CMS — управление каталогом Lara Lion
# Backend: GitHub (вход в /admin через GitHub-аккаунт).
# OAuth-вход обслуживает Cloudflare Worker (эндпоинты /api/auth и /api/callback),
# поэтому админка работает без Netlify.
# Источник данных: products.json (один файл со списком товаров).
# ============================================

backend:
  name: github
  repo: amolkanov95/laralion
  branch: main
  # Домен Worker, на котором живут OAuth-эндпоинты (см. worker.js).
  # auth_endpoint — путь, добавляемый к base_url; БЕЗ ведущего слеша,
  # иначе Decap склеит двойной слеш (base_url//api/auth) → 404.
  base_url: https://laralion.amolkanov95.workers.dev
  auth_endpoint: api/auth

# Куда медиатека загружает новые изображения (путь от корня репозитория)
media_folder: "collections"
# Как путь к изображению подставляется в products.json и на сайт
public_folder: "/collections"

# Русская локализация интерфейса редактора
locale: "ru"

collections:
  - name: "catalog"
    label: "Каталог"
    label_singular: "товар"
    editor:
      preview: false
    files:
      - name: "products"
        label: "Товары"
        file: "products.json"
        description: "Список товаров каталога. Порядок здесь = порядок на сайте."
        fields:
          - name: "products"
            label: "Товары"
            label_singular: "товар"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: "slug", label: "Идентификатор (латиницей, в URL)", widget: "string", pattern: ["^[a-z0-9-]+$", "Только строчные латинские буквы, цифры и дефис"] }
              - { name: "name", label: "Название", widget: "string" }
              - name: "category"
                label: "Категория"
                widget: "select"
                default: "bedding"
                options:
                  - { label: "Постельное белье", value: "bedding" }
                  - { label: "Кухонный текстиль", value: "kitchen" }
                  - { label: "Ткани", value: "fabrics" }
              - { name: "price", label: "Цена", widget: "string", hint: "Например: от 7 400 ₽" }
              - { name: "shortDescription", label: "Краткое описание (под названием в карточке)", widget: "string", hint: "Используется, если у товара НЕТ цветов, либо у выбранного цвета не задано своё описание. Если у товара есть цвета — заполняйте описание внутри каждого цвета." }
              - { name: "fullDescription", label: "Полное описание (в окне товара)", widget: "text" }
              - name: "seoAlt"
                label: "SEO-описание фото (alt)"
                widget: "string"
                required: false
                hint: "НЕОБЯЗАТЕЛЬНО. Краткое описание главного фото для поисковиков и слабовидящих. Помогает находить товар в поиске по картинкам Яндекса и Google. Пишите естественно, с ключевыми словами: материал, цвет, особенности. Пример: «Постельное бельё из варёного хлопка Прованс голубого цвета с рюшами». Если оставить пустым — описание сформируется автоматически из названия и категории."
              - { name: "mainImage", label: "Главное фото (в карточке)", widget: "image", hint: "Используется, если у товара НЕТ цветов. Для товаров с цветами фото берётся из галереи каждого цвета (первое фото = фото в карточке). Перед загрузкой сожмите: ширина до 2000px, JPEG/WebP, до 400 КБ. Инструменты: squoosh.app или tinypng.com." }
              - name: "colors"
                label: "Цвета"
                label_singular: "цвет"
                widget: "list"
                summary: "{{fields.name}}"
                hint: "Каждый цвет — это отдельный вариант товара со своими фотографиями. На сайте кружки переключают и фото в карточке, и весь слайдер в окне «Смотреть»."
                fields:
                  - { name: "name", label: "Название цвета", widget: "string" }
                  - { name: "hex", label: "Цвет кружка", widget: "color", allowInput: true }
                  - { name: "hex2", label: "Второй цвет кружка (для двухцветных)", widget: "color", allowInput: true, required: false, hint: "Заполните, если кружок должен показывать два цвета по диагонали. Пусто → кружок одноцветный." }
                  - { name: "shortDescription", label: "Краткое описание этого цвета (под названием в карточке)", widget: "string", required: false, hint: "Пусто → берётся общее краткое описание товара." }
                  - name: "images"
                    label: "Фотографии этого цвета (галерея в карточке и слайдере)"
                    label_singular: "фото"
                    widget: "list"
                    hint: "Первое фото = фото в карточке. Все фото показываются в слайдере окна «Смотреть» при выборе этого цвета. Каждое фото — сжатое, до 400 КБ."
                    field: { name: "image", label: "Фото", widget: "image" }
              - name: "images"
                label: "Фотографии (слайдер) — только для товаров без цветов"
                label_singular: "фото"
                widget: "list"
                required: false
                hint: "Используется ТОЛЬКО если у товара нет цветов. Для товаров с цветами загружайте фото внутри каждого цвета."
                field: { name: "image", label: "Фото", widget: "image", hint: "Сжатое фото, до 400 КБ (см. подсказку к главному фото)." }
              - name: "sizesLegend"
                label: "Подпись к столбцу состава (в окне товара)"
                widget: "string"
                required: false
                hint: "НЕОБЯЗАТЕЛЬНО. Поясняет, что за числа идут в столбце «Состав» — например: «пододеяльник · простыня · наволочки». Заполняйте, если в составе размеров указаны только числа. Пусто → подписи над таблицей не будет."
              - name: "sizes"
                label: "Размеры и состав комплекта"
                label_singular: "размер"
                widget: "list"
                summary: "{{fields.name}} — {{fields.spec}}"
                hint: "В окне товара размеры показываются таблицей: слева название, справа состав. Это справка для покупателя, а не выбор — нажимать их нельзя."
                fields:
                  - { name: "name", label: "Размер", widget: "string", hint: "Например: 2-спальный, Евро, Семейный." }
                  - { name: "spec", label: "Состав комплекта (сантиметры)", widget: "string", required: false, hint: "Числа в том же порядке, что в подписи выше. Например: 175×215 · 180×220 · 50×70 ×2. Пусто → покажется только название размера." }
              - name: "links"
                label: "Ссылки на маркетплейсы"
                widget: "object"
                hint: "Пустое поле → на сайте отобразится «Скоро в продаже»."
                fields:
                  - { name: "ozon", label: "Ozon", widget: "string", required: false }
                  - { name: "avito", label: "Avito", widget: "string", required: false }
                  - { name: "vk", label: "VK", widget: "string", required: false }
              - { name: "published", label: "Опубликован (показывать на сайте)", widget: "boolean", default: true }
