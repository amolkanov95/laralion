<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara Lion — Превью Hero</title>

    <!-- Подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=EB+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           ДИЗАЙН-СИСТЕМА: CSS-ПЕРЕМЕННЫЕ
        ============================================ */
        :root {
            --bg-color: #fcfbf9;       /* Молочно-кремовый (основа сайта) */
            --text-color: #2b1f17;     /* Кофейно-угольный (для читаемости текста) */
            --accent-gold: #d1b690;    /* Благородный золотой (напрямую из герба) */
            --card-bg: #ffffff;        /* Белый для карточек */
            --light-linen: #f5f4f0;    /* Цвет некрашеного льна для плашек */
        }

        /* ============================================
           БАЗОВЫЕ СТИЛИ
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============================================
           ШАПКА САЙТА (HEADER)
        ============================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: transparent;
            z-index: 1000;
            padding: 0 2rem 0 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Логотип слева */
        .header-logo {
            height: 160px;
            width: auto;
            transition: transform 0.3s ease;
            margin-right: 1rem;
            margin-top: -10px;
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        /* Навигационное меню по центру */
        .header-nav {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin-left: -18rem;
            margin-top: -30px;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background-color: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .header-nav a:hover {
            color: var(--accent-gold);
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        /* Кнопка Telegram справа */
        .header-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--accent-gold);
            border-radius: 0;
            transition: all 0.3s ease;
            margin-top: -30px;
        }

        .header-cta:hover {
            background-color: var(--accent-gold);
            color: var(--text-color);
        }

        /* ============================================
           HERO-БЛОК (ПЕРВЫЙ ЭКРАН)
        ============================================ */
        #hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 5%;
            overflow: hidden;
        }

        /* Фоновое изображение */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Полупрозрачный оверлей для читаемости текста */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(252, 251, 249, 0.95) 0%, rgba(252, 251, 249, 0.7) 50%, rgba(252, 251, 249, 0.2) 80%, transparent 100%);
            z-index: -1;
        }

        /* Контентная область Hero */
        .hero-content {
            width: 50%;
            max-width: 600px;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Фирменная каллиграфическая надпись "Lara Lion" */
        .hero-brand {
            font-family: 'Great Vibes', cursive;
            font-size: 8rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        /* Основной заголовок H1 */
        .hero-title {
            font-family: 'EB Garamond', serif;
            font-size: 1.6rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 0.8rem;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        /* Золотой разделитель */
        .hero-divider {
            width: 60%;
            height: 1px;
            background-color: var(--accent-gold);
            margin: 0 auto 0.8rem auto;
        }

        /* Подзаголовок */
        .hero-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.7;
            margin-bottom: 2rem;
            color: var(--text-color);
            opacity: 0.9;
        }

        /* Кнопка CTA */
        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            padding: 1rem 2.5rem;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid var(--accent-gold);
            border-radius: 0;
            transition: all 0.3s ease;
        }

        .hero-cta:hover {
            background-color: var(--accent-gold);
            color: var(--text-color);
        }


        /* ============================================
           АДАПТИВНОСТЬ (MOBILE FIRST)
        ============================================ */

        /* Планшеты и меньше */
        @media (max-width: 1024px) {
            .header-nav {
                gap: 1.5rem;
            }

            .header-nav a {
                font-size: 0.85rem;
            }

            .hero-brand {
                font-size: 3rem;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }
        }

        /* Мобильные устройства */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header-logo {
                height: 100px;
            }

            .header-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }

            .header-nav a {
                font-size: 0.75rem;
            }

            .header-cta {
                padding: 0.6rem 1.2rem;
                font-size: 0.85rem;
            }

            #hero {
                padding: 0 3%;
                justify-content: center;
                text-align: center;
            }

            .hero-overlay {
                background: rgba(252, 251, 249, 0.85);
            }

            .hero-content {
                max-width: 100%;
            }

            .hero-brand {
                font-size: 2.5rem;
            }

            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 0.95rem;
            }

            .hero-cta {
                padding: 0.9rem 2rem;
                font-size: 0.9rem;
            }

        }

        /* Очень маленькие экраны */
        @media (max-width: 480px) {
            .hero-brand {
                font-size: 2rem;
            }

            .hero-title {
                font-size: 1.6rem;
            }

            .hero-subtitle {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
         ШАПКА САЙТА (HEADER)
    ============================================ -->
    <header>
        <!-- Логотип слева -->
        <img src="./Изображение/Герб-логотип Lara Lion.png" alt="Lara Lion" class="header-logo">

        <!-- Навигационное меню по центру -->
        <nav>
            <ul class="header-nav">
                <li><a href="#collections">Каталог</a></li>
                <li><a href="#collections">Постельное белье</a></li>
                <li><a href="#collections">Кухонный текстиль</a></li>
                <li><a href="#collections">Ткани</a></li>
                <li><a href="#about">О нас</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
        </nav>

        <!-- Кнопка Telegram справа -->
        <a href="https://t.me/LaraLion25" target="_blank" class="header-cta">
            <span>Telegram</span>
        </a>
    </header>

    <!-- ============================================
         HERO-БЛОК (ПЕРВЫЙ ЭКРАН)
    ============================================ -->
    <section id="hero">
        <!-- Фоновое изображение -->
        <img src="./Изображение/фото спальни для первого экрана.jpg" alt="Спальня Lara Lion" class="hero-bg">

        <!-- Полупрозрачный оверлей -->
        <div class="hero-overlay"></div>

        <!-- Контентная область -->
        <div class="hero-content">
            <!-- Фирменная каллиграфическая надпись -->
            <div class="hero-brand">Lara Lion</div>

            <!-- Основной заголовок -->
            <h1 class="hero-title">ЭСТЕТИКА ПОСТЕЛЬНОГО СОВЕРШЕНСТВА</h1>

            <!-- Золотой разделитель -->
            <div class="hero-divider"></div>

            <!-- Подзаголовок -->
            <p class="hero-subtitle">
                Мы создаем уютное и красивое постельное белье из натуральных материалов для комфортного сна и стильного интерьера.
            </p>

            <!-- Кнопка CTA -->
            <a href="#collections" class="hero-cta">
                <span>Смотреть коллекцию</span>
                <span>→</span>
            </a>
        </div>
    </section>

</body>
</html>
